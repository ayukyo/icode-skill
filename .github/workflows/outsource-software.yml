name: Outsource software qualification

on:
  push:
    branches: [main]
    paths:
      - 'tools/outsource/**'
      - 'tools/icode_outsource.py'
      - 'tests/test_outsource*'
      - 'tests/test_crosscheck_freshness.py'
      - 'steps/outsource.md'
      - 'references/outsource_contract.md'
      - 'references/inspection_worklist.md'
      - 'schemas/outsource-contract.schema.json'
      - 'skill-packs/**'
      - 'mcp/workflow-gate/skill-routes.json'
      - 'SKILL.md'
      - '.github/workflows/outsource-software.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3
      - name: Outsource transactions, delivery, recovery and installed skill
        run: python -B -m pytest tests/test_outsource_store.py tests/test_outsource_workspace.py tests/test_outsource_cli.py tests/test_outsource_skill.py tests/test_outsource_review.py -q
      - name: Preserve exact LF and CRLF inspection evidence
        run: python -B -m pytest tests/test_crosscheck_freshness.py::test_assess_records_real_source_cells_and_freeze_makes_them_immutable -q
      - name: Shared skill and routing integrity
        run: python -B tools/validate_skill_pack.py --manifest skill-packs/manifest.json --routes mcp/workflow-gate/skill-routes.json --list
