name: Inspection helper software
on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'tools/inspection_worklist.py'
      - 'tools/icode_control.py'
      - 'tools/icode_crosscheck.py'
      - 'tools/test_result_summary.py'
      - 'tools/verification_evidence.py'
      - 'tools/icode_delivery.py'
      - 'tools/fast_policy.py'
      - 'tools/ticket_context.py'
      - 'tools/candidate_storage.py'
      - 'tools/stage_acceptance.py'
      - 'tools/verification_debt.py'
      - 'tools/lint_*'
      - 'tools/debug_catalog.py'
      - 'tools/learn.py'
      - 'tools/propose_skill_candidates.py'
      - 'tools/tb/scripts/tb_watch.py'
      - 'scripts/submission_guard.py'
      - 'agent_runtime/icode_agent/**'
      - 'schemas/ticket-metadata.schema.json'
      - 'mcp/workflow-gate/gates.json'
      - 'steps/**'
      - 'references/**'
      - 'SKILL.md'
      - 'tools/build_skill_distribution.py'
      - 'mcp/icode-local-index/**'
      - 'mcp/_lib/local_mcp_common.py'
      - 'mcp/_lib/environment_diagnostics.py'
      - 'mcp/_lib/claude_registry.py'
      - 'tools/mcp_doctor.py'
      - 'tests/test_environment_diagnostics.py'
      - 'tests/test_claude_registry_unit.py'
      - 'tests/test_field_verification_continuity.py'
      - 'mcp/icode-workspace/**'
      - 'mcp/icode-evidence/**'
      - 'mcp/icode-device-observe/**'
      - 'mcp/icode-mcp-health/**'
      - 'tests/test_local_mcp_suite.py'
      - 'tests/test_local_index_lifecycle.py'
      - 'tests/test_local_mcp_paths.py'
      - 'tests/test_local_mcp_access_policy.py'
      - 'tests/test_workspace_access_policy.py'
      - 'tests/test_test_result_summary.py'
      - 'tests/test_delivery*'
      - 'tests/test_fast*'
      - 'tests/test_overview_checkpoint.py'
      - 'tests/test_ticket*'
      - 'tests/test_candidate_storage*'
      - 'tests/data/candidate_reader_raw_io_allowlist.json'
      - 'tests/test_control_plane*'
      - 'tests/test_stage*'
      - 'tests/test_skill_distribution.py'
      - 'skill-packs/cross-layer-contract-audit/**'
      - 'mcp/workflow-gate/skill-routes.json'
      - 'tests/test_inspection*'
      - 'tests/test_crosscheck*'
      - 'tests/test_candidate_inspection_generations.py'
      - 'tests/test_candidate_freshness.py'
      - 'tests/inspection_windows_diagnostic.py'
      - '.github/workflows/inspection-software.yml'
      - 'tools/icode_candidate.py'
      - 'tests/test_candidate_git_provider_unit.py'
      - '.github/workflows/candidate-provider-software.yml'
      - 'tests/test_candidate_workflow_triggers.py'
      - 'tests/test_candidate_code_inspection_provider_unit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspection-software-${{ github.sha }}
  cancel-in-progress: false
jobs:
  generic-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install declared MCP and test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r mcp/icode-local-index/requirements.txt pytest==9.0.3
      - name: Index lifetime, local MCP and test report regressions
        run: python -m pytest -p no:anyio tests/test_local_index_lifecycle.py tests/test_local_mcp_suite.py tests/test_local_mcp_paths.py tests/test_local_mcp_access_policy.py tests/test_workspace_access_policy.py tests/test_test_result_summary.py tests/test_delivery_report.py tests/test_environment_diagnostics.py tests/test_claude_registry_unit.py tests/test_field_verification_continuity.py -q
      - name: Shared skill and route contract
        run: python tools/validate_skill_pack.py --manifest skill-packs/manifest.json --routes mcp/workflow-gate/skill-routes.json --list
      - name: Fast admission and derived ticket overview contracts
        run: python -m pytest -p no:anyio tests/test_fast_policy.py tests/test_fast_admission.py tests/test_overview_checkpoint.py tests/test_delivery_report.py tests/test_delivery_pending_path.py tests/test_ticket_context.py tests/test_ticket_material_ui.py tests/test_fast_patch_crosscheck.py -q
      - name: Candidate storage roundtrip and recovery contracts
        run: python -m pytest -p no:anyio tests/test_candidate_storage.py tests/test_candidate_storage_control.py tests/test_candidate_storage_stage.py tests/test_candidate_storage_faults.py tests/test_candidate_storage_readers.py tests/test_candidate_storage_doc_contract.py -q
      - name: Offline distribution resource contract
        if: runner.os == 'Linux'
        run: python -m pytest -p no:anyio tests/test_skill_distribution.py -q
      - name: Existing control and reasoning shell contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/test_fast_risk_upgrade_contract.sh
          bash tests/test_thinking_gate_contract.sh
          bash tests/test_tdd_workflow_contract.sh
          bash tests/test_control_plane_metadata_contract.sh
          bash tests/test_control_plane_transition_contract.sh
          bash tests/test_control_plane_regression_contract.sh
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Record actual source and tools
        run: |
          git rev-parse HEAD
          python --version
          git --version
      - name: Install legacy test runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3
      - name: Provider stdlib software contract
        run: python -m unittest discover -s tests -p test_inspection_git_provider_unit.py -v
      - name: Windows compatibility stdlib software contract
        run: python -m unittest discover -s tests -p test_inspection_windows_compatibility_unit.py -v
      - name: Syntax
        run: python -m py_compile tools/inspection_worklist.py tools/icode_control.py tools/icode_crosscheck.py tests/test_inspection_git_provider_unit.py tests/test_inspection_windows_compatibility_unit.py tests/inspection_windows_diagnostic.py
      - name: Bounded Windows startup and path diagnosis
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: python tests/inspection_windows_diagnostic.py
      - name: Record full required legacy collection
        run: python -m pytest -p no:anyio tests/test_inspection_worklist.py tests/test_inspection_checks.py tests/test_inspection_assess_cli.py tests/test_inspection_integration.py tests/test_crosscheck.py tests/test_candidate_inspection_generations.py --collect-only -q
      - name: Existing inspection legacy regressions
        run: python -m pytest -p no:anyio tests/test_inspection_worklist.py tests/test_inspection_checks.py tests/test_inspection_assess_cli.py tests/test_inspection_integration.py tests/test_crosscheck.py tests/test_candidate_inspection_generations.py -q
      - name: Install Linux shell contract dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
      - name: Existing Linux shell contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/test_inspection_worklist_contract.sh
          bash tests/test_crosscheck_contract.sh
