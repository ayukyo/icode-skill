name: Inspection helper software
on:
  push:
    branches: [main]
    paths:
      - 'tools/inspection_worklist.py'
      - 'tools/icode_control.py'
      - 'tools/icode_crosscheck.py'
      - 'tests/test_inspection*'
      - 'tests/test_crosscheck*'
      - 'tests/test_candidate_inspection_generations.py'
      - 'tests/test_candidate_freshness.py'
      - 'tests/inspection_windows_diagnostic.py'
      - '.github/workflows/inspection-software.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspection-software-${{ github.sha }}
  cancel-in-progress: false
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Record actual source and tools
        run: |
          git rev-parse HEAD
          python --version
          git --version
      - name: Install legacy test runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3
      - name: Provider stdlib software contract
        run: python -m unittest discover -s tests -p test_inspection_git_provider_unit.py -v
      - name: Windows compatibility stdlib software contract
        run: python -m unittest discover -s tests -p test_inspection_windows_compatibility_unit.py -v
      - name: Syntax
        run: python -m py_compile tools/inspection_worklist.py tools/icode_control.py tools/icode_crosscheck.py tests/test_inspection_git_provider_unit.py tests/test_inspection_windows_compatibility_unit.py tests/inspection_windows_diagnostic.py
      - name: Bounded Windows startup and path diagnosis
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: python tests/inspection_windows_diagnostic.py
      - name: Record full required legacy collection
        run: python -m pytest -p no:anyio tests/test_inspection_worklist.py tests/test_inspection_checks.py tests/test_inspection_assess_cli.py tests/test_inspection_integration.py tests/test_crosscheck.py tests/test_candidate_inspection_generations.py --collect-only -q
      - name: Existing inspection legacy regressions
        run: python -m pytest -p no:anyio tests/test_inspection_worklist.py tests/test_inspection_checks.py tests/test_inspection_assess_cli.py tests/test_inspection_integration.py tests/test_crosscheck.py tests/test_candidate_inspection_generations.py -q
      - name: Install Linux shell contract dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
      - name: Existing Linux shell contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/test_inspection_worklist_contract.sh
          bash tests/test_crosscheck_contract.sh
