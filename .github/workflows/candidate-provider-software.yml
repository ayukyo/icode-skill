name: Candidate provider software
on:
  push:
    branches: [main]
    paths:
      - 'tools/lint_workflow_contract.py'
      - 'tools/icode_candidate.py'
      - 'tools/icode_control.py'
      - 'tools/verification_evidence.py'
      - 'tools/verification_debt.py'
      - 'tools/icode_delivery.py'
      - 'scripts/submission_guard.py'
      - 'tests/test_candidate*'
      - 'tests/test_delivery*'
      - 'tests/test_execution_root_binding.py'
      - 'tests/test_ui_action_policy.py'
      - 'mcp/workflow-gate/gates.json'
      - 'schemas/ticket-metadata.schema.json'
      - 'schemas/ticket-event.schema.json'
      - 'tests/test_review_followup.py'
      - 'tests/test_workflow_evidence_gaps.py'
      - 'tests/test_execution_model_contract.sh'
      - '.github/workflows/candidate-provider-software.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-provider-software-${{ github.sha }}
  cancel-in-progress: false
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Record actual source and tools
        run: |
          git rev-parse HEAD
          python --version
          git --version
      - name: Install legacy test runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3
      - name: Install Linux shell contract dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
      - name: Candidate inspection trigger contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_workflow_triggers.py'); assert s.countTestCases()==3; r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Typed candidate stdlib contract
        run: python -B -m unittest discover -s tests -p test_candidate_git_provider_unit.py -v
      - name: Count required candidate provider cases
        run: python -B -c "import unittest; suite=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_git_provider_unit.py'); assert suite.countTestCases()==20, suite.countTestCases()"
      - name: Standalone linter UTF-8 wire contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_linter_utf8_unit.py'); assert s.countTestCases()==3, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Portable candidate capture failure contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_capture_failure_unit.py'); assert s.countTestCases()==2, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B1 context software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_context_unit.py'); assert s.countTestCases()==9, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B2 history software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_history_unit.py'); assert s.countTestCases()==12, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B3a candidate dispatch software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_dispatch_unit.py'); assert s.countTestCases()==12, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B3b build-start software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_build_start_provider_unit.py'); assert s.countTestCases()==12, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B3c record-verification software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_record_verification_provider_unit.py'); assert s.countTestCases()==15, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B3d port primitives software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_port_provider_unit.py'); assert s.countTestCases()==21, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Candidate B3e action-policy software contract
        run: python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests', pattern='test_candidate_action_policy_provider_unit.py'); assert s.countTestCases()==22, s.countTestCases(); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
      - name: Existing action-policy and verify intent consumers
        run: python -X utf8 -m pytest -p no:anyio tests/test_ui_action_policy.py::test_action_policy_is_control_plane_truth_and_revision_guard tests/test_ui_action_policy.py::test_exclusive_agent_spawn_is_cross_process_lock tests/test_ui_action_policy.py::test_closed_and_debug_tickets_do_not_receive_main_actions tests/test_review_followup.py::test_early_verify_only_build_and_plan -q
      - name: Existing port root, delivery and output consumer regressions
        run: python -m pytest -p no:anyio tests/test_execution_root_binding.py::BindingTests::test_real_cli_projection_and_subprocess_replay tests/test_review_followup.py::test_delivery_paths_are_single_source_and_keep_legacy_defaults tests/test_workflow_evidence_gaps.py::test_audit_final_check_fails_without_first_review_json_and_is_read_only -q
      - name: Syntax
        run: python -B -m py_compile tools/icode_candidate.py tests/test_candidate_git_provider_unit.py
      - name: Collect complete related legacy contract
        run: python -m pytest -p no:anyio tests/test_candidate_freshness.py tests/test_candidate_inspection_generations.py tests/test_candidate_verification.py tests/test_delivery_inventory.py tests/test_delivery_report.py --collect-only -q
      - name: Complete related legacy contract
        run: python -m pytest -p no:anyio tests/test_candidate_freshness.py tests/test_candidate_inspection_generations.py tests/test_candidate_verification.py tests/test_delivery_inventory.py tests/test_delivery_report.py -q
      - name: Existing Linux shell contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/test_inspection_worklist_contract.sh
          bash tests/test_crosscheck_contract.sh
          bash tests/test_execution_model_contract.sh
