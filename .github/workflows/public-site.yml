name: Public site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tools/build_public_site.py'
      - 'tools/notify_indexnow.py'
      - 'tests/test_public_site*.py'
      - 'tests/test_notify_indexnow.py'
      - 'SKILL.md'
      - '.github/workflows/public-site.yml'
  release:
    types: [published]
  workflow_dispatch:

# No automatic push, release creation, settings changes or external posting.
permissions:
  contents: read

concurrency:
  # Only authorized publications share cancellation across the complete build/deploy run.
  # Keep eligibility identical to the PUBLISH policy below; previews cannot cancel a deployment.
  group: public-site-${{ vars.PUBLIC_SITE_ENABLED == 'true' && vars.PUBLIC_SITE_URL != '' && ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'deployment' || format('preview-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      commit: ${{ steps.source.outputs.commit }}
    env:
      SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ayukyo.github.io/icode-skill/' }}
      EXPECTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bind exact source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Evaluate publication authorization
        id: policy
        env:
          PUBLISH: ${{ vars.PUBLIC_SITE_ENABLED == 'true' && vars.PUBLIC_SITE_URL != '' && ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Offline regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_public_site*.py' -v
          python3 -m unittest discover -s tests -p test_notify_indexnow.py -v
      - name: Build preview (no secrets, no deployment)
        if: steps.policy.outputs.publish != 'true'
        run: python3 tools/build_public_site.py --output _site --base-url "$SITE_URL" --expected-version "$EXPECTED_VERSION"
      - name: Build approved public artifact
        if: steps.policy.outputs.publish == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 tools/build_public_site.py --output _site --base-url "$SITE_URL" --expected-version "$EXPECTED_VERSION"
      - name: Package only generated public files
        if: steps.policy.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Notify participating search engines (optional)
        if: steps.deployment.outcome == 'success' && vars.INDEXNOW_ENABLED == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 tools/build_public_site.py --output _site --base-url "$SITE_URL"
          python3 tools/notify_indexnow.py --manifest _site/public-manifest.json --submit
      - name: Summarize evidence boundary
        if: always()
        run: echo 'Pages deployment and search notification are separate results. A received notification is not proof of indexing or ranking. Inspect each step above.' >> "$GITHUB_STEP_SUMMARY"
