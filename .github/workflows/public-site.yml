name: Public site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'context7.json'
      - 'assets/**'
      - 'agent_runtime/**'
      - 'site/**'
      - 'tools/build_public_site.py'
      - 'tools/render_brand_assets.py'
      - 'tools/notify_indexnow.py'
      - 'tools/release_promotion.py'
      - 'tools/build_skill_distribution.py'
      - 'tools/check_skill_discovery.py'
      - 'tools/check_skill_installation.py'
      - 'tools/check_skill_evaluation.py'
      - 'evals/**'
      - 'tools/prepare_skill_listing.py'
      - 'tools/validate_skill_pack.py'
      - 'tools/install_skill_pack.py'
      - 'install.sh'
      - 'scripts/sync-to-global.sh'
      - 'mcp/workflow-gate/skill-routes.json'
      - 'mcp/icode-workspace/**'
      - 'mcp/_lib/**'
      - 'mcp/icode-mcp-policy/policy.json'
      - 'references/**'
      - 'steps/**'
      - 'integrations/codebuddy/**'
      - '.gitignore'
      - 'integrations/discovery/**'
      - 'agents/**'
      - 'skill-packs/**'
      - 'tests/test_skill_distribution.py'
      - 'tests/test_skill_discovery_probe.py'
      - 'tests/test_skill_discovery_metadata.py'
      - 'tests/test_brand_assets.py'
      - 'tests/test_agent_ui*'
      - 'tests/test_skill_listing.py'
      - 'tests/test_docs_publication.py'
      - 'tests/test_skill_installation.py'
      - 'tests/test_host_skill_loading.py'
      - 'tests/test_skill_evaluation.py'
      - 'tests/test_tool_support_progress.py'
      - 'tests/test_build_preflight_safety.py'
      - 'tests/test_project_intake_contract.sh'
      - 'tests/test_control_plane_verify_doc_contract.sh'
      - 'tests/run_public_site_checks.py'
      - 'tests/test_public_site*.py'
      - 'tests/test_notify_indexnow.py'
      - 'tests/test_release_promotion*.py'
      - 'SKILL.md'
      - 'README*.md'
      - 'docs/**'
      - '.github/workflows/public-site.yml'
      - '.github/workflows/release-promotion.yml'
  release:
    types: [published]
  workflow_dispatch:

# Publishes after an authorized main push; never creates commits or releases.
permissions:
  contents: read

concurrency:
  # Serialize authorized publications without letting an old rerun cancel a newer one.
  # queue:max also preserves pending runs; cancel:false alone still replaces the pending slot.
  # Keep eligibility identical to PUBLISH; previews use a separate group.
  # Version the group so reruns of the old cancel:true workflow cannot cancel this queue.
  group: public-site-${{ vars.PUBLIC_SITE_ENABLED == 'true' && vars.PUBLIC_SITE_URL != '' && ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'deployment-v2' || format('preview-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      commit: ${{ steps.source.outputs.commit }}
    env:
      SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ayukyo.github.io/icode-skill/' }}
      EXPECTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bind exact source
        id: source
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          source_lastmod=$(git show -s --format=%cs "$GITHUB_SHA")
          echo "source_lastmod=$source_lastmod" >> "$GITHUB_OUTPUT"
      - name: Evaluate publication authorization
        id: policy
        env:
          PUBLISH: ${{ vars.PUBLIC_SITE_ENABLED == 'true' && vars.PUBLIC_SITE_URL != '' && ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Prepare CI test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3 PyYAML==6.0.2 -r mcp/icode-workspace/requirements.txt
      - name: Brand and UI regression tests
        run: |
          python3 -m pytest -p no:anyio tests/test_brand_assets.py tests/test_agent_ui*.py -q
          ICODE_UI_TEST_NO_RG=1 bash tests/test_agent_ui_contract.sh
      - name: Offline regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_public_site*.py' -v
          python3 -m unittest discover -s tests -p test_notify_indexnow.py -v
          python3 -m unittest discover -s tests -p 'test_release_promotion*.py' -v
          python3 -m unittest discover -s tests -p test_skill_distribution.py -v
          python3 -m unittest discover -s tests -p test_skill_discovery_probe.py -v
          python3 -m unittest discover -s tests -p test_skill_listing.py -v
          python3 -m unittest discover -s tests -p test_docs_publication.py -v
          python3 -m unittest discover -s tests -p test_skill_installation.py -v
          python3 -m pytest -p no:anyio tests/test_skill_evaluation.py -q
          python3 -m unittest discover -s tests -p test_tool_support_progress.py -v
          python3 -m pytest -p no:anyio tests/test_skill_discovery_metadata.py -q
          python3 -m pytest -p no:anyio tests/test_build_preflight_safety.py -q
          bash tests/test_project_intake_contract.sh
          bash tests/test_control_plane_verify_doc_contract.sh
      - name: Build preview (no secrets, no deployment)
        if: steps.policy.outputs.publish != 'true'
        env:
          SOURCE_LASTMOD: ${{ steps.source.outputs.source_lastmod }}
        run: python3 tools/build_public_site.py --output _site --base-url "$SITE_URL" --expected-version "$EXPECTED_VERSION" --source-lastmod "$SOURCE_LASTMOD" --google-site-verification "$GOOGLE_SITE_VERIFICATION" --bing-site-verification "$BING_SITE_VERIFICATION"
      - name: Build approved public artifact
        if: steps.policy.outputs.publish == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SOURCE_LASTMOD: ${{ steps.source.outputs.source_lastmod }}
        run: python3 tools/build_public_site.py --output _site --base-url "$SITE_URL" --expected-version "$EXPECTED_VERSION" --source-lastmod "$SOURCE_LASTMOD" --google-site-verification "$GOOGLE_SITE_VERIFICATION" --bing-site-verification "$BING_SITE_VERIFICATION"
      - name: Reject superseded publication source
        if: steps.policy.outputs.publish == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest=$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")
          latest=${latest%%[[:space:]]*}
          if [ "$latest" != "$(git rev-parse HEAD)" ]; then
            echo '::error::Superseded publication source; publish the latest default-branch run instead.'
            exit 1
          fi
      - name: Package only generated public files
        if: steps.policy.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Reject superseded publication source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest=$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")
          latest=${latest%%[[:space:]]*}
          if [ "$latest" != "$(git rev-parse HEAD)" ]; then
            echo '::error::Superseded publication source; publish the latest default-branch run instead.'
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Notify participating search engines (optional)
        id: search_notification
        if: steps.deployment.outcome == 'success' && vars.INDEXNOW_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 tools/build_public_site.py --output _site --base-url "$SITE_URL"
          python3 tools/notify_indexnow.py --manifest _site/public-manifest.json --submit | tee "$RUNNER_TEMP/indexnow-result.json"
      - name: Summarize evidence boundary
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          NOTIFICATION_OUTCOME: ${{ steps.search_notification.outcome }}
        shell: bash
        run: |
          # Use outcome, not conclusion: continue-on-error can make a failure look successful.
          {
            printf 'Pages deployment: %s\n\nIndexNow step outcome: %s\n\n' "$DEPLOYMENT_OUTCOME" "$NOTIFICATION_OUTCOME"
            if [ -s "$RUNNER_TEMP/indexnow-result.json" ]; then
              printf '```json\n'
              cat "$RUNNER_TEMP/indexnow-result.json"
              printf '\n```\n\n'
            else
              printf 'No notification result was produced; notification may be disabled, skipped or interrupted.\n\n'
            fi
            printf 'Pages deployment and search notification are separate results. A received notification is not proof of indexing or ranking.\n'
          } >> "$GITHUB_STEP_SUMMARY"
