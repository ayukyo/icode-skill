name: DOCX renderer qualification

on:
  pull_request:
    paths:
      - 'tools/docx/**'
      - 'install.sh'
      - 'scripts/sync-to-global.sh'
      - 'scripts/check-docx-renderer-release.py'
      - 'tools/build_skill_distribution.py'
      - 'tests/test_docx*'
      - 'tests/test_skill_distribution.py'
      - '.github/workflows/docx-renderer.yml'
  push:
    branches: [main]
    paths:
      - 'tools/docx/**'
      - 'install.sh'
      - 'scripts/sync-to-global.sh'
      - 'scripts/check-docx-renderer-release.py'
      - 'tools/build_skill_distribution.py'
      - 'tests/test_docx*'
      - 'tests/test_skill_distribution.py'
      - '.github/workflows/docx-renderer.yml'
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ubuntu-renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Initialize isolated runner state
        shell: bash
        run: |
          printf '%s\n' \
            "ICODE_DOCX_RUNTIME_ROOT=$RUNNER_TEMP/icode-docx-python" \
            "ICODE_DOCX_RENDERER_ROOT=$RUNNER_TEMP/icode-docx-renderer" \
            "CLAUDE_SKILLS_ROOT=$RUNNER_TEMP/icode-skills/claude" \
            "AGENTS_SKILLS_ROOT=$RUNNER_TEMP/icode-skills/codex" \
            "WORKBUDDY_SKILLS_ROOT=$RUNNER_TEMP/icode-skills/workbuddy" \
            "CODEBUDDY_COMMANDS_DIR=$RUNNER_TEMP/icode-commands/codebuddy" \
            "WORKBUDDY_COMMANDS_DIR=$RUNNER_TEMP/icode-commands/workbuddy" >> "$GITHUB_ENV"
      - name: General renderer libraries and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg libcairo2 libfontconfig1 libfreetype6 libcups2 libnss3 libdbus-1-3 libx11-6 libxext6 libx11-xcb1 libxinerama1 libxrender1 libsm6 libice6 libopenjp2-7 libtiff5 libjpeg-turbo8 liblcms2-2 fonts-noto-cjk
      - name: Offline failure and distribution contracts
        run: |
          python3 -m unittest discover -s tests -p test_docx_renderer.py -v
          python3 -m unittest discover -s tests -p test_skill_distribution.py -v
      - name: Public installer downloads and registers pinned owned renderer
        run: bash install.sh --client all --skip-mcp
      - name: Sync does not erase renderer registration
        run: |
          bash scripts/sync-to-global.sh --apply --client all
          python3 "$AGENTS_SKILLS_ROOT/icode/tools/docx/bootstrap_renderer.py" --check
          python3 scripts/check-docx-renderer-release.py --output-dir "$RUNNER_TEMP/docx-smoke"
      - name: Generated distribution retains the usable renderer chain
        run: |
          mkdir -p "$RUNNER_TEMP/docx-distribution"
          python3 tools/build_skill_distribution.py --output "$RUNNER_TEMP/docx-distribution/icode"
          python3 "$RUNNER_TEMP/docx-distribution/icode/skills/icode/scripts/check-docx-renderer-release.py" --output-dir "$RUNNER_TEMP/docx-package-smoke"
