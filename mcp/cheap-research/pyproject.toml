[project]
name = "cheap-research"
version = "0.9.0"
description = "cheap-research MCP server — 可选便宜 LLM 推理增强 for icode-skill"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "providers/*.py", "scripts/*.py"]
